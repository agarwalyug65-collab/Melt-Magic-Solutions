<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melt Magic Solutions</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <img src="MMS Logo.jpeg" alt="Melt Magic Solutions Logo" class="logo">
            <nav class="nav">
                <a href="#home">Home</a>
                <a href="#about">About Us</a>
                <a href="#contact">Contact Us</a>
            </nav>
        </div>
    </header>

    <!-- Contact Us Section -->
    <section id="contact" class="contact-section">
        <div class="container">
            <h2>Contact Us</h2>
            <p>Let's discuss your requirement. Send us your product requirement, specification, quantity or application details.</p>

            <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
                
                <!-- REQUIRED: Replace YOUR_ACCESS_KEY_HERE with the key sent to your email -->
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">

                <!-- Subject line for the email you receive -->
                <input type="hidden" name="subject" value="New Product Enquiry - Melt Magic Solutions">
                
                <!-- Prevent Spam Bot submissions -->
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div class="form-group">
                    <label for="name">Your Name / Company Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name or company" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your contact number">
                </div>

                <div class="form-group">
                    <label for="product_requirement">Product Requirement & Specification</label>
                    <input type="text" id="product_requirement" name="product_requirement" placeholder="e.g. Specific Grade, Size, Material" required>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="text" id="quantity" name="quantity" placeholder="e.g. 500 units, 2 Tons">
                </div>

                <div class="form-group">
                    <label for="application_details">Application Details / Additional Message</label>
                    <textarea id="application_details" name="application_details" rows="5" placeholder="Describe where or how the product will be used..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Enquiry</button>
            </form>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
